# 로컬 Docker 전용: Supabase 의 주소 모양(/rest/v1/...)을 흉내 내는 문지기.
server {
  listen 80;

  location /rest/v1/ {
    # 진짜 Supabase 는 키(JWT)를 검사하지만, 로컬에서는 검사 없이 통과시킵니다.
    proxy_set_header Authorization "";
    proxy_pass http://rest:3000/;
  }

  location / {
    return 404 '{"message":"local supabase stub: only /rest/v1 is available"}';
  }
}
