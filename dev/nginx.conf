# 로컬 Docker 전용: Supabase 의 주소 모양을 흉내 내는 문지기.
# 진짜 Supabase 가 아닙니다. 로컬에서 서버를 끝까지 확인해 보기 위한 것입니다.
server {
  listen 80;

  # DB: /rest/v1/... → PostgREST
  location /rest/v1/ {
    # 진짜 Supabase 는 키(JWT)를 검사하지만, 로컬에서는 검사 없이 통과시킵니다.
    proxy_set_header Authorization "";
    proxy_pass http://rest:3000/;
  }

  # 로그인 확인 흉내: 토큰이 "local-dev-token" 이면 가짜 사용자 한 명을 돌려줍니다.
  # (dev/00_supabase_stub.sql 에 넣어 둔 사용자와 같은 ID)
  location = /auth/v1/user {
    default_type application/json;
    if ($http_authorization != "Bearer local-dev-token") {
      return 401 '{"msg":"invalid token"}';
    }
    return 200 '{"id":"00000000-0000-0000-0000-000000000001","email":"local-tester@example.com"}';
  }

  location / {
    return 404 '{"message":"local supabase stub: only /rest/v1 and /auth/v1/user are available"}';
  }
}
