# 강사용 로컬 DB (선택). Supabase 프로젝트 없이 SQL 과 서버를 확인할 때 씁니다.
#   켜기:  docker compose -f dev/docker-compose.yml up -d
#   끄기:  docker compose -f dev/docker-compose.yml down -v   (-v 는 데이터까지 삭제)
# 서버(api/.env)에는 이렇게 넣습니다.
#   SUPABASE_URL=http://localhost:54321
#   SUPABASE_SERVICE_ROLE_KEY=local.dev.key
# 로그인(구글)은 로컬 DB 로는 확인할 수 없습니다. 진짜 Supabase 프로젝트가 필요합니다.
name: jeju-hanbakwi-dev

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "54329:5432"
    volumes:
      - ./00_supabase_stub.sql:/docker-entrypoint-initdb.d/00_supabase_stub.sql:ro
      - ../supabase/migrations/001_init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
      - ../supabase/migrations/002_image_credit.sql:/docker-entrypoint-initdb.d/02_image_credit.sql:ro
      - ../supabase/migrations/003_admin.sql:/docker-entrypoint-initdb.d/03_admin.sql:ro
      - ../supabase/migrations/004_ai_usage.sql:/docker-entrypoint-initdb.d/04_ai_usage.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  rest:
    image: postgrest/postgrest:v12.2.8
    environment:
      PGRST_DB_URI: postgres://postgres:postgres@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: service_role
    depends_on:
      db:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    ports:
      - "54321:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - rest
